<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Monitor Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .error-message {
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .sensor-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .sensor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sensor-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .fan-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .fan-on {
            background: #e8f5e8;
            color: #27ae60;
        }

        .fan-off {
            background: #ffeaa7;
            color: #e17055;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-item {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(145deg, #f0f0f0, #ffffff);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .co { color: #e74c3c; }
        .no2 { color: #f39c12; }
        .no { color: #9b59b6; }
        .so2 { color: #3498db; }
        .voc { color: #1abc9c; }

        .charts-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .charts-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .charts-header h2 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 1.2rem;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .time-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .time-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .time-btn.active {
            background: #2c3e50;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .status-bar {
                flex-direction: column;
                align-items: center;
            }
            
            .time-controls {
                flex-wrap: wrap;
            }
            
            .sensor-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌬️ Air Quality Monitor</h1>
            <p>Real-time monitoring of air pollutants with automated filtration system</p>
        </div>

        <div class="error-message" id="errorMessage">
            <!-- Error messages will be displayed here -->
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div>Status: <span id="connectionStatus">Connecting...</span></div>
            </div>
            <div class="status-item">
                <div>Last Updated: <span id="lastUpdate">Loading...</span></div>
            </div>
            <div class="status-item">
                <div>Total Records: <span id="totalRecords">0</span></div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="sensor-card">
                <div class="sensor-header">
                    <div class="sensor-title">📡 Sensor 1 - Before Filtration</div>
                    <div class="fan-status" id="fan1Status">
                        <span>🔌 Fan OFF</span>
                    </div>
                </div>
                <div class="metrics-grid" id="sensor1Metrics">
                    <!-- Metrics will be populated by JavaScript -->
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-header">
                    <div class="sensor-title">📡 Sensor 2 - After Filtration</div>
                    <div class="fan-status" id="fan2Status">
                        <span>🔌 Fan OFF</span>
                    </div>
                </div>
                <div class="metrics-grid" id="sensor2Metrics">
                    <!-- Metrics will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="charts-section">
            <div class="charts-header">
                <h2>Data Analysis</h2>
                <div class="time-controls">
                    <button class="time-btn active" onclick="changeTimeRange(720)">1 Hour</button>
                    <button class="time-btn" onclick="changeTimeRange(2160)">3 Hours</button>
                    <button class="time-btn" onclick="changeTimeRange(4320)">6 Hours</button>
                    <button class="time-btn" onclick="changeTimeRange(8640)">12 Hours</button>
                </div>
            </div>
            
            <div id="loadingDiv" class="loading">
                <div class="spinner"></div>
                Loading sensor data...
            </div>
            
            <div id="chartsContainer" style="display: none;">
                <div class="chart-container">
                    <canvas id="pollutantsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pollutantsChart;
        let currentTimeRange = 720; // Default 1 hour
        let fetchAttempts = 0;
        const maxRetries = 3;

        const pollutantConfigs = {
            co: { label: 'CO (ppm)', color: '#e74c3c', unit: 'ppm' },
            no2: { label: 'NO₂ (ppm)', color: '#f39c12', unit: 'ppm' },
            no: { label: 'NO (ppm)', color: '#9b59b6', unit: 'ppm' },
            so2: { label: 'SO₂ (ppm)', color: '#3498db', unit: 'ppm' },
            voc: { label: 'VOC (ppb)', color: '#1abc9c', unit: 'ppb' }
        };

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function updateConnectionStatus(status) {
            document.getElementById('connectionStatus').textContent = status;
        }

        async function fetchData() {
            try {
                updateConnectionStatus('Connecting...');
                
                // Fixed API path - should be relative to domain
                const response = await fetch(`api/store_data.php?limit=${currentTimeRange}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    updateConnectionStatus('Connected');
                    updateDashboard(result.data);
                    updateCharts(result.data);
                    fetchAttempts = 0; // Reset retry counter on success
                } else {
                    throw new Error(result.error || 'Unknown API error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                updateConnectionStatus('Disconnected');
                
                fetchAttempts++;
                if (fetchAttempts <= maxRetries) {
                    showError(`Connection error: ${error.message}. Retrying... (${fetchAttempts}/${maxRetries})`);
                    // Retry after a delay
                    setTimeout(fetchData, 5000);
                } else {
                    showError(`Failed to connect after ${maxRetries} attempts. Check your connection and server.`);
                    fetchAttempts = 0; // Reset for next manual retry
                }
            }
        }

        function updateDashboard(data) {
            if (data.length === 0) {
                showError('No data available from sensors');
                document.getElementById('totalRecords').textContent = '0';
                document.getElementById('lastUpdate').textContent = 'No data';
                return;
            }

            const latest = data[data.length - 1];
            
            // Update status bar
            document.getElementById('lastUpdate').textContent = new Date(latest.timestamp).toLocaleString();
            document.getElementById('totalRecords').textContent = data.length;

            // Update sensor 1
            updateSensorMetrics('sensor1', latest, 'sensor1');
            updateFanStatus('fan1Status', latest.sensor1_fan_status);

            // Update sensor 2
            updateSensorMetrics('sensor2', latest, 'sensor2');
            updateFanStatus('fan2Status', latest.sensor2_fan_status);
        }

        function updateSensorMetrics(elementId, data, sensorPrefix) {
            const container = document.getElementById(elementId + 'Metrics');
            container.innerHTML = '';

            Object.keys(pollutantConfigs).forEach(pollutant => {
                const value = data[`${sensorPrefix}_${pollutant}`];
                const config = pollutantConfigs[pollutant];
                
                const metricDiv = document.createElement('div');
                metricDiv.className = 'metric-item';
                metricDiv.innerHTML = `
                    <div class="metric-value ${pollutant}">${value ? value.toFixed(2) : '0.00'}</div>
                    <div class="metric-label">${config.label}</div>
                `;
                container.appendChild(metricDiv);
            });
        }

        function updateFanStatus(elementId, status) {
            const element = document.getElementById(elementId);
            if (status == 1) {
                element.className = 'fan-status fan-on';
                element.innerHTML = '<span>💨 Fan ON</span>';
            } else {
                element.className = 'fan-status fan-off';
                element.innerHTML = '<span>🔌 Fan OFF</span>';
            }
        }

        function updateCharts(data) {
            if (data.length === 0) {
                document.getElementById('loadingDiv').innerHTML = '<div class="spinner"></div>No data available for charts';
                return;
            }

            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('chartsContainer').style.display = 'block';

            const labels = data.map(item => new Date(item.timestamp).toLocaleTimeString());
            
            const datasets = [];
            
            // Add sensor 1 datasets
            Object.keys(pollutantConfigs).forEach(pollutant => {
                const config = pollutantConfigs[pollutant];
                datasets.push({
                    label: `Sensor 1 - ${config.label}`,
                    data: data.map(item => item[`sensor1_${pollutant}`] || 0),
                    borderColor: config.color,
                    backgroundColor: config.color + '20',
                    borderWidth: 2,
                    fill: false,
                    tension: 0.1
                });
            });

            // Add sensor 2 datasets with dashed lines
            Object.keys(pollutantConfigs).forEach(pollutant => {
                const config = pollutantConfigs[pollutant];
                datasets.push({
                    label: `Sensor 2 - ${config.label}`,
                    data: data.map(item => item[`sensor2_${pollutant}`] || 0),
                    borderColor: config.color,
                    backgroundColor: config.color + '20',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.1
                });
            });

            if (pollutantsChart) {
                pollutantsChart.destroy();
            }

            const ctx = document.getElementById('pollutantsChart').getContext('2d');
            pollutantsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Concentration'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: 'Air Quality Measurements Over Time'
                        }
                    }
                }
            });
        }

        function changeTimeRange(range) {
            currentTimeRange = range;
            
            // Update active button
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show loading and fetch new data
            document.getElementById('loadingDiv').style.display = 'flex';
            document.getElementById('chartsContainer').style.display = 'none';
            
            fetchData();
        }

        // Initial load
        fetchData();
        
        // Auto-refresh every 30 seconds
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
