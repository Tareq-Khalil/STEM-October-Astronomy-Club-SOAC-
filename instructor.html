<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - Cosmic Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }

        .room-code-display {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .room-code {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 5px;
            margin: 10px 0;
        }

        .teams-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .team-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .team-card h3 {
            margin-bottom: 10px;
        }

        .team-score {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .question-display {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .question-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            padding: 15px;
            background: white;
            border: 3px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f0f0f0;
        }

        .option-btn.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .option-btn.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .timer {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }

        .timer.warning {
            color: #f5576c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .buzz-status {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        .answer-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .answer-status {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }

        .answer-status.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .answer-status.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cosmic Quest</h1>
            <p>Instructor Dashboard</p>
        </div>

        <div class="content">
            <!-- Section 1: Create Room -->
            <div id="createRoomSection" class="section active">
                <h2>Create New Room</h2>
                <div class="form-group">
                    <label>Instructor Name</label>
                    <input type="text" id="instructorName" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Instructor Password</label>
                    <input type="password" id="instructorPassword" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Select Wave/Round</label>
                    <select id="waveSelect">
                        <option value="1">Round of 32 (Wave 1)</option>
                        <option value="2">Round of 16 (Wave 2)</option>
                        <option value="3">Quarter Finals (Wave 3)</option>
                        <option value="4">Semi Finals (Wave 4)</option>
                        <option value="5">Finals (Wave 5)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Team 1</label>
                    <select id="team1Select"></select>
                </div>
                <div class="form-group">
                    <label>Team 2</label>
                    <select id="team2Select"></select>
                </div>
                <button class="btn" onclick="createRoom()">Create Room</button>
                <div id="createRoomAlert"></div>
            </div>

            <!-- Section 2: Room Created -->
            <div id="roomCreatedSection" class="section">
                <h2>Room Created Successfully!</h2>
                <div class="room-code-display">
                    <p>Share this code with teams:</p>
                    <div class="room-code" id="roomCodeDisplay"></div>
                    <p>Room ID: <span id="roomIdDisplay"></span></p>
                </div>
                <button class="btn" onclick="startMatch()">Start Match</button>
            </div>

            <!-- Section 3: Match Control -->
            <div id="matchControlSection" class="section">
                <h2>Match Control</h2>
                
                <div class="teams-display">
                    <div class="team-card">
                        <h3 id="team1Name">Team 1</h3>
                        <div class="team-score" id="team1Score">0</div>
                        <p>Score</p>
                        <div class="score-controls">
                            <button class="btn btn-small" onclick="adjustScore(1, -1)">- Point</button>
                            <button class="btn btn-small btn-success" onclick="adjustScore(1, 1)">+ Point</button>
                        </div>
                    </div>
                    <div class="team-card">
                        <h3 id="team2Name">Team 2</h3>
                        <div class="team-score" id="team2Score">0</div>
                        <p>Score</p>
                        <div class="score-controls">
                            <button class="btn btn-small" onclick="adjustScore(2, -1)">- Point</button>
                            <button class="btn btn-small btn-success" onclick="adjustScore(2, 1)">+ Point</button>
                        </div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">
                        <span id="progressText">Question 0/20</span>
                    </div>
                </div>

                <div class="timer" id="timer">30</div>

                <div class="question-display" id="questionDisplay">
                    <h3>Question <span id="questionNumber">1</span></h3>
                    <img id="questionImage" class="question-image" src="" alt="Question">
                    <div class="options-grid">
                        <div class="option-btn" id="optionA">A: </div>
                        <div class="option-btn" id="optionB">B: </div>
                        <div class="option-btn" id="optionC">C: </div>
                        <div class="option-btn" id="optionD">D: </div>
                    </div>
                </div>

                <div id="buzzStatus" class="buzz-status" style="display: none;"></div>
                <div id="answerStatus" class="answer-status" style="display: none;"></div>

                <div class="answer-controls" id="answerControls" style="display: none;">
                    <button class="btn btn-success" onclick="handleCorrectAnswer()">✓ Correct - Next Question</button>
                    <button class="btn btn-secondary" onclick="handleWrongAnswer()">✗ Wrong - Let Other Team Answer</button>
                    <button class="btn btn-warning" onclick="skipToNext()">Skip Question</button>
                </div>

                <div class="controls">
                    <button class="btn" onclick="startQuestion()" id="startQuestionBtn">Start Question</button>
                    <button class="btn btn-success" onclick="forceNextQuestion()" id="nextQuestionBtn" style="display: none;">Next Question</button>
                    <button class="btn btn-secondary" onclick="endMatch()" id="endMatchBtn">End Match</button>
                </div>

                <div id="matchAlert"></div>
            </div>

            <!-- Section 4: Match Completed -->
            <div id="matchCompletedSection" class="section">
                <h2>Match Completed!</h2>
                <div class="teams-display">
                    <div class="team-card">
                        <h3 id="finalTeam1Name">Team 1</h3>
                        <div class="team-score" id="finalTeam1Score">0</div>
                    </div>
                    <div class="team-card">
                        <h3 id="finalTeam2Name">Team 2</h3>
                        <div class="team-score" id="finalTeam2Score">0</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Declare Winner</label>
                    <select id="winnerSelect">
                        <option value="">Select Winner</option>
                    </select>
                </div>
                <button class="btn" onclick="declareWinner()">Declare Winner & Update Bracket</button>
                <div id="winnerAlert"></div>
            </div>
        </div>
    </div>

    <script>
        let roomData = null;
        let currentQuestionNum = 0;
        let questions = [];
        let timerInterval = null;
        let pollInterval = null;
        let currentAnsweringTeam = null;
        let otherTeamAnswered = false;
        let team1Id = null;
        let team2Id = null;

        // Load teams on page load
        window.onload = function() {
            loadTeams();
        };

        async function loadTeams() {
            try {
                const response = await fetch('api/admin.php?action=get_teams');
                const data = await response.json();
                if (data.success) {
                    const team1Select = document.getElementById('team1Select');
                    const team2Select = document.getElementById('team2Select');
                    
                    data.teams.forEach(team => {
                        const option1 = document.createElement('option');
                        option1.value = team.id;
                        option1.textContent = team.team_name;
                        team1Select.appendChild(option1);
                        
                        const option2 = document.createElement('option');
                        option2.value = team.id;
                        option2.textContent = team.team_name;
                        team2Select.appendChild(option2);
                    });
                }
            } catch (error) {
                console.error('Error loading teams:', error);
            }
        }

        async function createRoom() {
            const instructorName = document.getElementById('instructorName').value;
            const instructorPassword = document.getElementById('instructorPassword').value;
            const waveId = document.getElementById('waveSelect').value;
            const team1Id = document.getElementById('team1Select').value;
            const team2Id = document.getElementById('team2Select').value;

            if (!instructorName || !instructorPassword) {
                showAlert('createRoomAlert', 'Please fill in all fields', 'error');
                return;
            }

            if (team1Id === team2Id) {
                showAlert('createRoomAlert', 'Please select different teams', 'error');
                return;
            }

            try {
                const response = await fetch('api/instructor.php?action=create_room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instructor_name: instructorName,
                        instructor_password: instructorPassword,
                        wave_id: waveId,
                        team1_id: team1Id,
                        team2_id: team2Id
                    })
                });

                const data = await response.json();
                if (data.success) {
                    roomData = data;
                    document.getElementById('roomCodeDisplay').textContent = data.room_code;
                    document.getElementById('roomIdDisplay').textContent = data.room_id;
                    showSection('roomCreatedSection');
                    
                    // Load questions
                    await loadQuestions(waveId);
                } else {
                    showAlert('createRoomAlert', data.error || 'Failed to create room', 'error');
                }
            } catch (error) {
                showAlert('createRoomAlert', 'Error creating room: ' + error.message, 'error');
            }
        }

        async function loadQuestions(waveId) {
            try {
                const response = await fetch(`api/instructor.php?action=get_questions&wave_id=${waveId}`);
                const data = await response.json();
                if (data.success) {
                    questions = data.questions;
                }
            } catch (error) {
                console.error('Error loading questions:', error);
            }
        }

        function startMatch() {
            showSection('matchControlSection');
            currentQuestionNum = 1;
            updateQuestionDisplay();
            startPolling();
        }

        function updateQuestionDisplay() {
            if (currentQuestionNum > 20) {
                endMatch();
                return;
            }

            const question = questions[currentQuestionNum - 1];
            if (question) {
                document.getElementById('questionNumber').textContent = currentQuestionNum;
                document.getElementById('questionImage').src = question.question_image_url;
                document.getElementById('optionA').textContent = 'A: ' + question.option_a;
                document.getElementById('optionB').textContent = 'B: ' + question.option_b;
                document.getElementById('optionC').textContent = 'C: ' + question.option_c;
                document.getElementById('optionD').textContent = 'D: ' + question.option_d;
                
                // Reset option styles
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    document.getElementById('option' + opt).className = 'option-btn';
                });

                const progress = (currentQuestionNum / 20) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = `Question ${currentQuestionNum}/20`;
            }
            
            // Reset answer controls
            document.getElementById('answerControls').style.display = 'none';
            document.getElementById('answerStatus').style.display = 'none';
            otherTeamAnswered = false;
        }

        async function startQuestion() {
            try {
                const response = await fetch('api/instructor.php?action=start_question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_id: roomData.room_id,
                        question_number: currentQuestionNum
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('startQuestionBtn').style.display = 'none';
                    document.getElementById('buzzStatus').style.display = 'none';
                    document.getElementById('answerStatus').style.display = 'none';
                    document.getElementById('answerControls').style.display = 'none';
                    startTimer(30);
                }
            } catch (error) {
                console.error('Error starting question:', error);
            }
        }

        function startTimer(seconds) {
            let timeLeft = seconds;
            const timerEl = document.getElementById('timer');
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    timerEl.classList.add('warning');
                } else {
                    timerEl.classList.remove('warning');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerEl.textContent = 'Time Up!';
                }
            }, 1000);
        }

        function startPolling() {
            clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`api/team.php?action=get_room_state&room_id=${roomData.room_id}`);
                    const data = await response.json();
                    if (data.success) {
                        updateRoomState(data.state);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 1000);
        }

        function updateRoomState(state) {
            document.getElementById('team1Score').textContent = state.team1_score;
            document.getElementById('team2Score').textContent = state.team2_score;
            document.getElementById('team1Name').textContent = state.team1_name;
            document.getElementById('team2Name').textContent = state.team2_name;
            
            team1Id = state.team1_id;
            team2Id = state.team2_id;

            // Show if someone buzzed in
            if (state.buzzer_locked && state.buzzed_team_id) {
                currentAnsweringTeam = state.buzzed_team_id;
                const teamName = state.buzzed_team_id == state.team1_id ? state.team1_name : state.team2_name;
                document.getElementById('buzzStatus').textContent = `${teamName} buzzed in! Waiting for answer...`;
                document.getElementById('buzzStatus').style.display = 'block';
                document.getElementById('answerControls').style.display = 'flex';
            }

            // Show answer feedback if a team just answered
            if (state.last_answer_team_id && state.last_answer_time) {
                const answerTime = new Date(state.last_answer_time).getTime();
                const now = new Date().getTime();
                const timeSinceAnswer = (now - answerTime) / 1000;
                
                // Only show if answer was within last 5 seconds
                if (timeSinceAnswer < 5) {
                    const teamName = state.last_answer_team_id == state.team1_id ? state.team1_name : state.team2_name;
                    const answerStatusEl = document.getElementById('answerStatus');
                    
                    if (state.last_answer_correct) {
                        answerStatusEl.className = 'answer-status correct';
                        answerStatusEl.textContent = `✓ ${teamName} answered CORRECTLY! (${state.last_answer_given})`;
                    } else {
                        answerStatusEl.className = 'answer-status incorrect';
                        answerStatusEl.textContent = `✗ ${teamName} answered WRONG (${state.last_answer_given})`;
                    }
                    answerStatusEl.style.display = 'block';
                }
            }
        }

        async function handleCorrectAnswer() {
            clearInterval(timerInterval);
            
            // Show correct status
            const answerStatusEl = document.getElementById('answerStatus');
            answerStatusEl.className = 'answer-status correct';
            answerStatusEl.textContent = '✓ Correct Answer! Moving to next question...';
            answerStatusEl.style.display = 'block';
            
            document.getElementById('answerControls').style.display = 'none';
            
            // Highlight correct answer
            const question = questions[currentQuestionNum - 1];
            if (question) {
                document.getElementById('option' + question.correct_answer).classList.add('correct');
            }
            
            // Wait a moment then move to next question
            setTimeout(() => {
                moveToNextQuestion();
            }, 2000);
        }

        async function handleWrongAnswer() {
            if (otherTeamAnswered) {
                // Both teams answered wrong, show correct answer and move on
                const answerStatusEl = document.getElementById('answerStatus');
                answerStatusEl.className = 'answer-status incorrect';
                answerStatusEl.textContent = '✗ Both teams answered incorrectly. Moving to next question...';
                answerStatusEl.style.display = 'block';
                
                document.getElementById('answerControls').style.display = 'none';
                
                // Highlight correct answer
                const question = questions[currentQuestionNum - 1];
                if (question) {
                    document.getElementById('option' + question.correct_answer).classList.add('correct');
                }
                
                setTimeout(() => {
                    moveToNextQuestion();
                }, 2000);
            } else {
                // Let other team answer
                const otherTeamId = currentAnsweringTeam === team1Id ? team2Id : team1Id;
                const otherTeamName = currentAnsweringTeam === team1Id ? 
                    document.getElementById('team2Name').textContent : 
                    document.getElementById('team1Name').textContent;
                
                try {
                    const response = await fetch('api/instructor.php?action=allow_other_team', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            room_id: roomData.room_id,
                            other_team_id: otherTeamId
                        })
                    });

                    const data = await response.json();
                    if (data.success) {
                        otherTeamAnswered = true;
                        const answerStatusEl = document.getElementById('answerStatus');
                        answerStatusEl.className = 'answer-status incorrect';
                        answerStatusEl.textContent = `✗ Wrong! ${otherTeamName} can now answer...`;
                        answerStatusEl.style.display = 'block';
                        
                        document.getElementById('buzzStatus').textContent = `Waiting for ${otherTeamName} to buzz in...`;
                    }
                } catch (error) {
                    console.error('Error allowing other team:', error);
                }
            }
        }

        async function skipToNext() {
            const answerStatusEl = document.getElementById('answerStatus');
            answerStatusEl.className = 'answer-status';
            answerStatusEl.textContent = 'Question skipped. Moving to next question...';
            answerStatusEl.style.display = 'block';
            
            document.getElementById('answerControls').style.display = 'none';
            clearInterval(timerInterval);
            
            // Highlight correct answer
            const question = questions[currentQuestionNum - 1];
            if (question) {
                document.getElementById('option' + question.correct_answer).classList.add('correct');
            }
            
            // Reset buzzer for both teams in database
            try {
                await fetch('api/instructor.php?action=reset_buzzers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_id: roomData.room_id
                    })
                });
            } catch (error) {
                console.error('Error resetting buzzers:', error);
            }
            
            setTimeout(() => {
                moveToNextQuestion();
            }, 2000);
        }

        async function moveToNextQuestion() {
            try {
                const response = await fetch('api/instructor.php?action=next_question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_id: roomData.room_id
                    })
                });

                const data = await response.json();
                if (data.success) {
                    currentQuestionNum++;
                    
                    if (currentQuestionNum > 20) {
                        endMatch();
                        return;
                    }
                    
                    updateQuestionDisplay();
                    document.getElementById('startQuestionBtn').style.display = 'inline-block';
                    document.getElementById('buzzStatus').style.display = 'none';
                    document.getElementById('answerStatus').style.display = 'none';
                    document.getElementById('answerControls').style.display = 'none';
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = '30';
                    document.getElementById('timer').classList.remove('warning');
                }
            } catch (error) {
                console.error('Error moving to next question:', error);
            }
        }

        async function forceNextQuestion() {
            await moveToNextQuestion();
        }

        async function adjustScore(teamNumber, adjustment) {
            try {
                const response = await fetch('api/instructor.php?action=adjust_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_id: roomData.room_id,
                        team_number: teamNumber,
                        adjustment: adjustment
                    })
                });

                const data = await response.json();
                if (data.success) {
                    // Score will be updated by polling
                    showAlert('matchAlert', 'Score adjusted!', 'success');
                    setTimeout(() => {
                        document.getElementById('matchAlert').style.display = 'none';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error adjusting score:', error);
            }
        }

        function endMatch() {
            clearInterval(pollInterval);
            clearInterval(timerInterval);
            
            // Get final scores
            fetch(`api/team.php?action=get_room_state&room_id=${roomData.room_id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('finalTeam1Name').textContent = data.state.team1_name;
                        document.getElementById('finalTeam2Name').textContent = data.state.team2_name;
                        document.getElementById('finalTeam1Score').textContent = data.state.team1_score;
                        document.getElementById('finalTeam2Score').textContent = data.state.team2_score;
                        
                        const winnerSelect = document.getElementById('winnerSelect');
                        winnerSelect.innerHTML = '<option value="">Select Winner</option>';
                        winnerSelect.innerHTML += `<option value="${data.state.team1_id}">${data.state.team1_name}</option>`;
                        winnerSelect.innerHTML += `<option value="${data.state.team2_id}">${data.state.team2_name}</option>`;
                    }
                });
            
            showSection('matchCompletedSection');
        }

        async function declareWinner() {
            const winnerId = document.getElementById('winnerSelect').value;
            
            if (!winnerId) {
                showAlert('winnerAlert', 'Please select a winner', 'error');
                return;
            }

            try {
                const response = await fetch('api/instructor.php?action=declare_winner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_id: roomData.room_id,
                        winner_team_id: winnerId
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('winnerAlert', 'Winner declared! Bracket updated.', 'success');
                    setTimeout(() => {
                        window.location.href = 'bracket.html';
                    }, 2000);
                } else {
                    showAlert('winnerAlert', data.error || 'Failed to declare winner', 'error');
                }
            } catch (error) {
                showAlert('winnerAlert', 'Error: ' + error.message, 'error');
            }
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }

        function showAlert(elementId, message, type) {
            const alertEl = document.getElementById(elementId);
            alertEl.className = `alert alert-${type}`;
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        }
    </script>
</body>
</html>
